[project]
name = "setra-vision-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]
training = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
